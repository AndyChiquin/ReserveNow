version: '3.8'

services:
  tables-db:
    image: mysql:8.0
    container_name: tables-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  tables-create:
    build:
      context: .
      dockerfile: app/domain/create/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    depends_on:
      - tables-db
    restart: always

  tables-read:
    build:
      context: .
      dockerfile: app/domain/read/Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - .env
    depends_on:
      - tables-db
    restart: always

  tables-update:
    build:
      context: .
      dockerfile: app/domain/update/Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - .env
    depends_on:
      - tables-db
    restart: always

  tables-delete:
    build:
      context: .
      dockerfile: app/domain/delete/Dockerfile
    ports:
      - "8004:8004"
    env_file:
      - .env
    depends_on:
      - tables-db
    restart: always

volumes:
  db_data:
