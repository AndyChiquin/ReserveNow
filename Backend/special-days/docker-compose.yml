version: "3.8"

services:
  special-days-create:
    build: ./app/domain/create
    restart: always
    env_file: .env
    ports:
      - "5400:5400"
    depends_on:
      - db

  special-days-read:
    build: ./app/domain/read
    restart: always
    env_file: .env
    ports:
      - "5401:5401"
    depends_on:
      - db

  special-days-update:
    build: ./app/domain/update
    restart: always
    env_file: .env
    ports:
      - "5402:5402"
    depends_on:
      - db

  special-days-delete:
    build: ./app/domain/delete
    restart: always
    env_file: .env
    ports:
      - "5403:5403"
    depends_on:
      - db

  db:
    image: postgres:latest
    restart: always
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
