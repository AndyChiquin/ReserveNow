version: '3.8'

services:
  create:
    build:
      context: .
      dockerfile: app/domain/create/Dockerfile
    ports:
      - "5001:5001"
    env_file:
      - .env
    depends_on:
      - mariadb

  read:
    build:
      context: .
      dockerfile: app/domain/read/Dockerfile
    ports:
      - "5002:5002"
    env_file:
      - .env
    depends_on:
      - mariadb

  update:
    build:
      context: .
      dockerfile: app/domain/update/Dockerfile
    ports:
      - "5003:5003"
    env_file:
      - .env
    depends_on:
      - mariadb

  delete:
    build:
      context: .
      dockerfile: app/domain/delete/Dockerfile
    ports:
      - "5004:5004"
    env_file:
      - .env
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
